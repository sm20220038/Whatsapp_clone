server.port=8444
server.ssl.key-store=${WACLONE_P12:../../certs/dev.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=waclone-dev
server.ssl.enabled=${WACLONE_TLS:true}
waclone.http.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/waclone?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${WACLONE_DB_USER:root}
spring.datasource.password=${WACLONE_DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

waclone.jwt.secret=${WACLONE_JWT_SECRET:waclone-shared-secret-change-me-please-0123456789}
waclone.jwt.ttlHours=72
waclone.media.dir=./media
